<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SkillBridge">
  <!--
    The same mark as the header logo: a compass needle on the brand blue.
    Drawn on a filled tile rather than as a bare glyph so it stays legible on
    both a light and a dark browser tab strip without needing two files.
  -->
  <rect width="32" height="32" rx="7" fill="#1c5d99"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="8.5"/>
    <path d="M19.8 12.2 18.2 18.2 12.2 19.8 13.8 13.8Z" fill="#ffffff" stroke-width="1.5"/>
  </g>
</svg>

# SkillBridge reverse proxy.
#
# Nginx is the only publicly exposed service in production: it terminates TLS,
# applies a second layer of rate limiting (the per-process limiter inside the
# API cannot see traffic across replicas), and forwards to the app containers.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"'
    '}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 12M;          # a little above the 10 MB upload limit
    client_body_timeout 30s;
    client_header_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # Rate-limit zones. Authentication is deliberately far tighter than reads.
    limit_req_zone $binary_remote_addr zone=api_read:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m  rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    upstream skillbridge_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream skillbridge_web {
        server web:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # Redirect everything to HTTPS, except the ACME challenge.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        limit_conn conn_per_ip 40;

        # Correlation id: reuse the client's if present, otherwise mint one.
        set $req_id $http_x_request_id;
        if ($req_id = "") { set $req_id $request_id; }

        location /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://skillbridge_api;
            include /etc/nginx/proxy_params_sb;
        }

        location /api/ {
            limit_req zone=api_write burst=30 nodelay;
            proxy_pass http://skillbridge_api;
            include /etc/nginx/proxy_params_sb;
        }

        location ~ ^/(docs|redoc|openapi.json|health|ready)$ {
            limit_req zone=api_read burst=20 nodelay;
            proxy_pass http://skillbridge_api;
            include /etc/nginx/proxy_params_sb;
        }

        # Next.js build assets are immutable and content-hashed.
        location /_next/static/ {
            proxy_pass http://skillbridge_web;
            include /etc/nginx/proxy_params_sb;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=api_read burst=40 nodelay;
            proxy_pass http://skillbridge_web;
            include /etc/nginx/proxy_params_sb;
        }
    }
}

# Production overlay:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from development:
#   * Nginx terminates TLS and is the only exposed port
#   * no seeding, no debug, no Mailpit
#   * secrets come from the environment and are required, not defaulted
#   * database and cache ports are not published to the host

name: skillbridge-prod

services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    ports: []

  minio:
    ports: []

  mailpit:
    profiles: ["never"]

  api:
    ports: []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SEED_ON_START: "false"
      LOG_JSON: "true"
      SECURE_COOKIES: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-ses}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 1G }

  worker:
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
    deploy:
      replicas: 2

  web:
    ports: []

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy_params_sb:/etc/nginx/proxy_params_sb:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
